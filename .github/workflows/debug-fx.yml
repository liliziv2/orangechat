name: Debug FX Build

on:
  push:
    branches:
      - glass-fx-only
      - orangechat-ib-tg
      - feat/ib-inspired-six-fx
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Create dummy google-services.json
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "0",
              "project_id": "orangechat-fx-debug"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0",
                  "android_client_info": {
                    "package_name": "me.rerere.orangechat.fx"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "debug"}],
                "services": {
                  "appinvite_service": {"other_platform_oauth_client": []}
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:1",
                  "android_client_info": {
                    "package_name": "me.rerere.orangechat.fx.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [{"current_key": "debug"}],
                "services": {
                  "appinvite_service": {"other_platform_oauth_client": []}
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Ensure debug keystore
        id: keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            echo "仓库内无共享 debug keystore，生成一次并提交回仓库，"
            echo "之后所有 CI 构建复用同一签名，APK 可直接覆盖安装。"
            keytool -genkeypair -v \
              -keystore app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "复用仓库内共享 debug keystore"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit shared debug keystore
        if: steps.keystore.outputs.generated == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f app/debug.keystore
          git commit -m "ci: 提交共享 debug keystore，固定 CI 包签名 [skip ci]" \
                     -m "避免每次 CI 现生成随机 keystore 导致新包与已装 APK 签名冲突（覆盖安装被拒）。debug keystore 密码为公开约定值 android，不含敏感信息；release 签名仍走 local.properties，不受影响。"
          git push origin HEAD:${GITHUB_REF_NAME}

      # 单元测试。以前这个 workflow 只 assembleDebug，于是"加了回归测试"实际上从没被执行过 ——
      # ProactiveMessageRequestAssemblyTest 这类纯逻辑测试必须真的跑起来才算数。
      # 基线已经全绿（141 tests / 0 failures），所以这里是硬门槛：
      # 单测挂了就挂构建，不再有「红了也没人看」的空间。
      - name: Run unit tests
        id: unit_tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

      # 不管上一步成败都打一份汇总，方便直接从日志里读结果。
      - name: Summarise unit test results
        if: always()
        run: |
          echo "== test result files =="
          find app/build/test-results -name '*.xml' 2>/dev/null | head -50 || true
          echo "== totals =="
          python3 - <<'PY' || true
          import glob, re
          t = f = e = s = 0
          for p in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              head = open(p, encoding="utf-8", errors="replace").read(2000)
              m = re.search(r'tests="(\d+)".*?skipped="(\d+)".*?failures="(\d+)".*?errors="(\d+)"', head)
              if m:
                  t += int(m.group(1)); s += int(m.group(2)); f += int(m.group(3)); e += int(m.group(4))
          print(f"tests={t} skipped={s} failures={f} errors={e}")
          PY
          echo "== failures =="
          grep -rh -A3 "<failure\|<error" app/build/test-results/**/*.xml 2>/dev/null | head -80 || true

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      # 先把产物目录打出来：万一 artifact 又是空的，看这一步就知道是编译没出包
      # 还是上传环节丢的，不用再猜。
      - name: List APK output
        run: ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: orangechat-fx-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
